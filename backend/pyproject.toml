[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "TECHIE-TITAN", email = "goyalvansh2006@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
